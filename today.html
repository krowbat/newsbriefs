<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新闻简报 - 今日</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
  color: #333;
  background: #fafafa;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #eee;
  border-top: 3px solid #ff4757;
  border-radius: 50%;
  margin: 40px auto;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
p { color: #666; }
a { color: #ff4757; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>📰 每日新闻简报</h1>
<div class="spinner"></div>
<p>正在加载今日简报...</p>
<p id="fallback" style="display:none;margin-top:20px;">
  如果长时间未跳转，请 <a id="link" href="/">点击这里</a>
</p>

<script>
// 自动检测最新的简报日期
const dates = [
  '2026-04-11',
  '2026-04-10',
  '2026-04-09',
  '2026-04-08'
];

const today = dates[0];
const url = `news-brief-${today}.html`;

// 尝试跳转
try {
  window.location.replace(url);
} catch(e) {
  // 如果跳转失败，显示链接
  document.getElementById('fallback').style.display = 'block';
  document.getElementById('link').href = url;
  document.getElementById('link').textContent = `查看 ${today} 的简报`;
}

// 3秒后如果还在这个页面，显示备用链接
setTimeout(() => {
  document.getElementById('fallback').style.display = 'block';
  const link = document.getElementById('link');
  link.href = url;
  link.textContent = `查看 ${today} 的简报`;
}, 3000);
</script>
</body>
</html>
