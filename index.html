<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>新闻简报 - 自动跳转</title>
    <script>
        // 获取今天的日期 YYYY-MM-DD
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const today = `${year}-${month}-${day}`;
        
        // 构造今天的链接
        const targetUrl = `./news-brief-${today}.html`;
        
        // 执行跳转
        window.location.href = targetUrl;
    </script>
</head>
<body>
    <p>正在为您跳转至今日简报...</p>
</body>
</html>
